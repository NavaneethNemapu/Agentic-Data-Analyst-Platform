version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic_analyst_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-auto}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TARGET_DB_URL=sqlite:///./data/target.db
      - SYSTEM_DB_URL=sqlite:///./data/system.db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-secret-major-project-key}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic_analyst_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: agentic_analyst_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic_analyst_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-system_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  redis_data:
  pgdata:
